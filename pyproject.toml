[project]
name = "matchmind"
version = "0.2.0"
description = "Multi-agent explainable match intelligence from synthetic football events"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "agent-framework-core>=1.22",
  "agent-framework-openai>=1.0",
  "agent-framework-foundry>=1.15",
  "mcp>=2.3",
  "azure-identity>=1.26",
  "azure-cosmos>=4.17",
  "azure-eventhub>=5.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
copilot = ["github-copilot-sdk>=1.0.23rc5"]

[project.scripts]
matchmind = "matchmind.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["matchmind*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["RUF001", "RUF003"]  # non-ASCII text is intentional (translations)
